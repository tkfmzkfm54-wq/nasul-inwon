        srv.calls++;

          return { data: null, error: { message: "Failed to fetch" } };
        }
        if (q.op === "update" && srv.beforeUpdate) {
          const fn = srv.beforeUpdate;
          srv.beforeUpdate = null;
          fn();
        }
        const hit = !!srv.row && Object.entries(q.conds).every(([k, v]) => srv.row[k] === v);

          if (srv.row) {
            return { error: { code: "23505", message: "duplicate key" } };

          return { error: null };

          if (!hit) {
            return { data: [], error: null };
          }
          Object.assign(srv.row, Jsonb(q.vals));
          return { data: [pick(q.ret)], error: null };
        }
        return { data: hit ? pick(q.cols) : null, error: null };

        select(c) { if (q.op === "select") { q.cols = c; } else { q.ret = c; } return ch; },

        update(v) { q.op = "update"; q.vals = v; return ch; },
        eq(k, v) { q.conds[k] = v; return ch; },
        maybeSingle() { return ch; },
        single() { return ch; },
        then(ok, no) { return new Promise(r => setTimeout(r, 5)).then(run).then(ok, no); },
      };
