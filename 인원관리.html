// 반응속도 꼴찌: 가장 느린 사람의 순서 (부정출발 = Infinity, 같으면 앞 사람). 없으면 -1
function FindSlowest(arrMs) {
  let nSlow = -1;
  for (let nIdx = 0; nIdx < arrMs.length; nIdx++) {
    if (nSlow < 0 || arrMs[nIdx] > arrMs[nSlow]) {
      nSlow = nIdx;
    }
  }
  return nSlow;
}

// ---- 반응속도: 한 명씩 화면이 초록색이 되는 순간 누르기. 가장 느린 사람(부정출발 포함)이 당첨 ----
GAMES.react = () => {
  const btnNew = h("button", { type: "button", class: "btn primary" }, "🔀 처음부터");
  const btnPad = h("button", { type: "button", class: "rx-pad" });
  const elRank = h("ol", { class: "rank" });
  let stRx = null;
  let nTimer = 0;
  let nLockUntil = 0;   // 방금 누른 사람이 한 번 더 눌러 다음 사람 차례를 시작하지 않게 잠깐 막음
  let pAudio = null;
  mount("⚡ 반응속도", [btnNew], h("div", { class: "stack pass-wrap" }, btnPad, h("div", { class: "rank-box" }, h("h3", {}, "기록"), elRank)), () => {
    if (stRx.strPhase === "ready" || stRx.strPhase === "done") {
      Ready();
    }
  });

  function Ready() {
    clearTimeout(nTimer);
    stRx = { arrPs: sides().ps, arrMs: [], nTurn: 0, strPhase: "ready", nGoAt: 0, stOut: null };
    Paint();
  }
  function OnPad() {
    const nNow = performance.now();
    if (stRx.arrPs.length < 2 || stRx.strPhase === "done" || nNow < nLockUntil) {
      return;
    }
    if (stRx.strPhase === "ready") {
      pAudio ??= CreateAudio();
      stRx.strPhase = "wait";
      nTimer = setTimeout(() => {
        stRx.strPhase = "go";
        stRx.nGoAt = performance.now();
        PlayTone(pAudio, 880, 0.15);
        Paint();
      }, 1500 + Math.random() * 2500);
      Paint();
    } else if (stRx.strPhase === "wait") {
      clearTimeout(nTimer);
      Finish(Infinity);   // 부정출발
    } else {
      Finish(Math.round(nNow - stRx.nGoAt));
    }
  }
  function Finish(nMs) {
    stRx.arrMs.push(nMs);
    stRx.nTurn++;
    nLockUntil = performance.now() + 800;
    stRx.strPhase = stRx.nTurn < stRx.arrPs.length ? "ready" : "done";
    if (stRx.strPhase === "done") {
      stRx.stOut = stRx.arrPs[FindSlowest(stRx.arrMs)];
      record(stRx.stOut, "반응속도");
    }
    Paint();
  }
  const GetMsText = nMs => nMs === Infinity ? "부정출발 ✖" : `${nMs}ms`;
  function Paint() {
    const arrPs = stRx.arrPs;
    const stNow = arrPs[stRx.nTurn];
    const nLast = stRx.arrMs.length - 1;
    const strLast = nLast >= 0 ? `${arrPs[nLast].name}: ${GetMsText(stRx.arrMs[nLast])}` : "";
    btnPad.className = "rx-pad" + (stRx.strPhase === "wait" ? " wait" : stRx.strPhase === "go" ? " go" : "");
    if (arrPs.length < 2) {
      btnPad.replaceChildren("참가자가 2명 이상이어야 해요");
    } else if (stRx.strPhase === "ready") {
      btnPad.replaceChildren(h("span", { style: `color:${stNow.c}` }, stNow.name), h("span", {}, "차례"),
        h("small", {}, (strLast ? strLast + " · " : "") + "누르면 시작, 초록색이 되는 순간 바로 누르세요"));
    } else if (stRx.strPhase === "wait") {
      btnPad.replaceChildren("기다리세요…", h("small", {}, "먼저 누르면 부정출발"));
    } else if (stRx.strPhase === "go") {
      btnPad.replaceChildren("지금!");
    } else {
      btnPad.replaceChildren(h("span", {}, "🏁 ", stRx.stOut.name, " 당첨!"), h("small", {}, `${strLast} · 가장 느렸어요 · ‘처음부터’로 다시`));
    }
    const arrOrder = stRx.arrMs.map((nMs, nIdx) => ({ nMs, stP: arrPs[nIdx] })).sort((stA, stB) => stA.nMs - stB.nMs);
    elRank.replaceChildren(...arrOrder.map(stRec => h("li", {}, h("i", { style: `background:${stRec.stP.c}` }), `${stRec.stP.name} · ${GetMsText(stRec.nMs)}`)));
  }
  btnPad.onpointerdown = e => {
    e.preventDefault();
    OnPad();
  };
  btnPad.onkeydown = e => {   // 키보드로도 (Space·Enter)
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      OnPad();
    }
  };
  btnNew.onclick = Ready;
  stopGame = () => {
    clearTimeout(nTimer);
    pAudio?.close();
  };
  Ready();
};

/**
 * 라이어 한 판: 주제("" = 아무거나)에서 제시어 하나, 라이어 한 명
 * 몰아주기면 걸릴 사람이 라이어가 되기 쉬움(wpick). 안 켜면 고르게
 */
function CreateLiarRound(arrPs, strTopic) {
  const arrTopics = Object.keys(LIAR_WORDS);
  const strPick = strTopic || arrTopics[Math.floor(Math.random() * arrTopics.length)];
  const arrWords = LIAR_WORDS[strPick];
  return { strTopic: strPick, strWord: arrWords[Math.floor(Math.random() * arrWords.length)], nLiar: wpick(arrPs) };
}

// ---- 라이어 게임: 폰을 돌려 각자 제시어 확인(라이어만 모름) → 설명하고 지목 → 공개. 라이어가 걸리면 라이어 벌칙 ----
GAMES.liar = () => {
  const selTopic = h("select", { class: "sel", "aria-label": "주제" }, h("option", { value: "" }, "주제 아무거나"),
    Object.keys(LIAR_WORDS).map(strTopic => h("option", { value: strTopic }, strTopic)));
  const btnNew = h("button", { type: "button", class: "btn primary" }, "🔀 새 판");
  const elCard = h("div", { class: "liar-card" });
  const elStrip = h("div", { class: "ps-strip" });
  let stLiar = null;
  mount("🕵️ 라이어 게임", [selTopic, btnNew], h("div", { class: "stack pass-wrap" }, elCard, elStrip), () => StartRound());

  function StartRound() {
    const arrPs = sides().ps;
    stLiar = { arrPs, nTurn: 0, bShow: false, strPhase: "pass", bDone: false };
    if (arrPs.length >= 3) {
      Object.assign(stLiar, CreateLiarRound(arrPs, selTopic.value));
    }
    Paint();
  }
  function Next() {
    stLiar.bShow = false;
    stLiar.nTurn++;
    if (stLiar.nTurn >= stLiar.arrPs.length) {
      stLiar.strPhase = "talk";
    }
    Paint();
  }
  function Finish(bCaught) {
    stLiar.bDone = true;
    if (bCaught) {
      record(stLiar.arrPs[stLiar.nLiar], "라이어 게임");
    } else {
      toast("라이어 승리! 라이어 빼고 모두 한 잔 🍻");
    }
    Paint();
  }
  const CreateBtn = (strClass, strText, fnClick) => h("button", { type: "button", class: strClass, onclick: fnClick }, strText);
  function Paint() {
    const arrPs = stLiar.arrPs;
    const stNow = arrPs[stLiar.nTurn];
    const bLiarNow = stLiar.nTurn === stLiar.nLiar;
    elCard.classList.toggle("liar", stLiar.strPhase === "pass" && stLiar.bShow && bLiarNow);
    if (arrPs.length < 3) {
      elCard.replaceChildren(h("p", { class: "note" }, "참가자가 3명 이상이어야 해요"));
    } else if (stLiar.strPhase === "pass" && !stLiar.bShow) {
      elCard.replaceChildren(h("small", {}, "🤫 다른 사람이 못 보게"), h("strong", { style: `color:${stNow.c}` }, stNow.name),
        CreateBtn("btn primary big", "제시어 보기", () => {
          stLiar.bShow = true;
          Paint();
        }));
    } else if (stLiar.strPhase === "pass") {
      const stNext = arrPs[stLiar.nTurn + 1];
      elCard.replaceChildren(h("small", {}, `주제: ${stLiar.strTopic}`), h("strong", {}, bLiarNow ? "😈 당신은 라이어!" : stLiar.strWord),
        h("small", {}, bLiarNow ? "들키지 말고 제시어를 알아내세요" : "라이어에게 들키지 않게 설명하세요"),
        CreateBtn("btn big", stNext ? `확인 → ${stNext.name}에게 넘기기` : "확인 → 모두 봤어요", Next));
    } else if (stLiar.strPhase === "talk") {
      elCard.replaceChildren(h("small", {}, `주제: ${stLiar.strTopic}`), h("strong", {}, "🗣 한 명씩 설명!"),
        h("small", {}, `${arrPs[0].name}부터 차례로 제시어를 한마디로 설명하고, 다 같이 라이어를 지목하세요`),
        CreateBtn("btn primary big", "🕵️ 라이어 공개", () => {
          stLiar.strPhase = "reveal";
          Paint();
        }));
    } else {
      const stLiarP = arrPs[stLiar.nLiar];
      elCard.replaceChildren(h("small", {}, `제시어: ${stLiar.strWord}`), h("strong", {}, "라이어는 ", h("span", { style: `color:${stLiarP.c}` }, stLiarP.name)),
        stLiar.bDone ? h("small", {}, "‘새 판’을 누르면 다시")
          : h("div", { class: "bar" }, CreateBtn("btn primary", "🍺 라이어 걸림 (라이어 벌칙)", () => Finish(true)), CreateBtn("btn", "😈 라이어 승리", () => Finish(false))));
    }
    elStrip.replaceChildren(...CreateTurnStrip(arrPs, stLiar.strPhase === "pass" ? stNow : null));
  }
  selTopic.onchange = StartRound;
  btnNew.onclick = StartRound;
  StartRound();
};

/**
 * 카드 하나 뽑기: 아직 안 나온 것 중에서 고름. 다 나왔으면 처음부터 다시
 * @param arrKeys 카드마다 겹침 기준 값. 초성처럼 다른 카드가 같은 값이면 그 값은 한 번만 나옴
 * @param setUsed 이미 나온 기준 값 (뽑은 값을 여기에 더함)
 * @return 뽑은 카드 번호
 */
function PickCard(arrKeys, setUsed) {
  let arrLeft = [...arrKeys.keys()].filter(nIdx => !setUsed.has(arrKeys[nIdx]));
  if (!arrLeft.length) {
    setUsed.clear();
    arrLeft = [...arrKeys.keys()];
  }
  const nPick = arrLeft[Math.floor(Math.random() * arrLeft.length)];
  setUsed.add(arrKeys[nPick]);
  return nPick;
}

// 한글 초성: "사과" → "ㅅㄱ". 한글 음절이 아닌 글자는 그대로
function CalcChosung(strWord) {
  return [...strWord].map(strCh => {
    const nCode = strCh.charCodeAt(0) - 0xAC00;
    return nCode >= 0 && nCode < 11172 ? CHOSUNG[Math.floor(nCode / 588)] : strCh;
  }).join("");
}

// 남은 시간(초, 올림). 0 = 시간 끝. 시각은 performance.now() 기준(ms)이라 폰이 잠깐 꺼졌다 켜져도 맞음
function CalcLeftSec(nEndAt, nNow) {
  return Math.max(0, Math.ceil((nEndAt - nNow) / 1000));
}

// 스피드 퀴즈 꼴찌: 가장 낮은 점수의 순서들(동점이면 모두). 모두 같은 점수면 무승부 = 빈 배열
function FindLowestSides(arrScores) {
  const nMin = Math.min(...arrScores);
  const arrLow = [...arrScores.keys()].filter(nIdx => arrScores[nIdx] === nMin);
  return arrLow.length === arrScores.length ? [] : arrLow;
}

/**
 * 질문 카드 놀이 틀 (밸런스 게임·이미지 게임)
 * 질문 → ‘셋·둘·하나’ → 다 같이 고르거나 지목 → 벌칙 받을 사람을 눌러 기록
 * @param fnCreateQ 질문 하나를 카드 안에 넣을 요소 배열로 만드는 함수
 * @param strPickHelp 벌칙 받을 사람 고르는 법 안내
 */
function ShowCardGame(strTitle, strGame, arrQs, fnCreateQ, strPickHelp) {
  const btnNext = h("button", { type: "button", class: "btn primary" }, "🔀 다음 질문");
  const elCard = h("div", { class: "liar-card" });
  const elPick = h("div", { class: "who-list pick-list" });
  const btnRecord = h("button", { type: "button", class: "btn primary big" }, "🍺 고른 사람 벌칙");
  const setUsed = new Set();
  const setPicked = new Set();   // 벌칙 받을 사람 id
  let nQ = 0;
  let nCount = 0;   // 3·2·1 = 세는 중, -1 = 다 셈("지금!"), 0 = 안 셈
  let nTimer = 0;
  mount(strTitle, [btnNext], h("div", { class: "stack pass-wrap" }, elCard, h("p", { class: "lad-result" }, strPickHelp), elPick, btnRecord), () => PaintPick());

  function NextCard() {
    clearTimeout(nTimer);
    nQ = PickCard(arrQs, setUsed);
    nCount = 0;
    setPicked.clear();
    PaintCard();
    PaintPick();
  }
  function StartCount() {
    clearTimeout(nTimer);
    nCount = 3;
    PaintCard();
    nTimer = setTimeout(CountDown, 800);
  }
  function CountDown() {
    nCount = nCount > 1 ? nCount - 1 : -1;
    PaintCard();
    if (nCount > 0) {
      nTimer = setTimeout(CountDown, 800);
    }
  }
  function PaintCard() {
    if (nCount > 0) {
      elCard.replaceChildren(h("strong", {}, String(nCount)));
      return;
    }
    elCard.replaceChildren(...fnCreateQ(arrQs[nQ]),
      nCount < 0 ? h("small", { class: "boom" }, "지금! 다 같이 👉") : null,
      h("button", { type: "button", class: "btn big", onclick: StartCount }, nCount < 0 ? "⏱ 다시 세기" : "⏱ 셋·둘·하나!"));
  }
  // 참가자 칩: 눌러서 벌칙 받을 사람 고르기 (참가자에서 뺀 사람은 고른 것도 풀림)
  function PaintPick() {
    const arrPs = players();
    for (const nId of [...setPicked]) {
      if (!arrPs.some(stP => stP.id === nId)) {
        setPicked.delete(nId);
      }
    }
    elPick.replaceChildren(...arrPs.map(stP => h("button", {
      type: "button", class: "who-chip", "aria-pressed": String(setPicked.has(stP.id)),
      onclick: () => {
        if (setPicked.has(stP.id)) {
          setPicked.delete(stP.id);
        } else {
          setPicked.add(stP.id);
        }
        PaintPick();
      },
    }, stP.name)));
  }
  btnRecord.onclick = () => {
    const arrOut = players().filter(stP => setPicked.has(stP.id));
    if (!arrOut.length) {
      toast("벌칙 받을 사람을 먼저 눌러 주세요.");
      return;
    }
    for (const stP of arrOut) {
      record(stP, strGame);
    }
    toast(`🍺 ${arrOut.map(stP => stP.name).join(", ")} 벌칙!`);
    NextCard();
  };
  btnNext.onclick = NextCard;
  stopGame = () => clearTimeout(nTimer);
  NextCard();
}

// ---- 초성 게임: 초성에 맞는 낱말을 차례로 말하고 폰을 넘김. 시간 안에 못 대거나 틀리면 당첨 ----
GAMES.chosung = () => {
  const selSec = h("select", { class: "sel", "aria-label": "한 사람 제한 시간" }, [5, 7, 10].map(nSec => h("option", { value: nSec }, `한 명 ${nSec}초`)));
  selSec.value = "7";
  const btnNew = h("button", { type: "button", class: "btn primary" }, "🔤 새 초성");
  const elCard = h("div", { class: "liar-card" });
  const elStrip = h("div", { class: "ps-strip" });
  const elLeft = h("div", { class: "cs-left" });   // 남은 초: 똑딱마다 글자만 바꿈 (버튼을 다시 만들면 누르는 중인 터치가 씹힘)
  const arrKeys = CHOSUNG_WORDS.map(CalcChosung);
  const setUsed = new Set();
  let stCs = null;
  let nTimer = 0;
  let nLastSec = 0;   // 남은 초가 바뀔 때만 똑딱 소리
  let pAudio = null;
  mount("🔤 초성 게임", [selSec, btnNew], h("div", { class: "stack pass-wrap" }, elCard, elStrip), () => {
    if (!stCs.bRun) {
      Ready();
    }
  });

  function Ready() {
    clearTimeout(nTimer);
    stCs = { arrPs: sides().ps, nWord: PickCard(arrKeys, setUsed), nTurn: 0, nEndAt: 0, bRun: false, stOut: null };
    Paint();
  }
  function Start() {
    if (stCs.arrPs.length < 2) {
      toast("참가자가 2명 이상이어야 해요.");
      return;
    }
    pAudio ??= CreateAudio();
    stCs.bRun = true;
    stCs.nTurn = 0;
    stCs.nEndAt = performance.now() + selSec.value * 1000;
    Paint();
    Tick();
  }
  function Tick() {
    const nLeft = CalcLeftSec(stCs.nEndAt, performance.now());
    if (nLeft === 0) {
      Lose();
      return;
    }
    if (nLeft !== nLastSec && nLeft <= 3) {
      PlayTone(pAudio, 1000, 0.05);
    }
    nLastSec = nLeft;
    PaintLeft(nLeft);
    nTimer = setTimeout(Tick, 200);
  }
  function PaintLeft(nLeft) {
    elLeft.textContent = `${nLeft}초`;
    elLeft.classList.toggle("hurry", nLeft <= 3);
  }
  // 말했어요 → 다음 사람. 이미 시간이 지났으면(폰이 잠깐 꺼졌던 경우 등) 지금 사람이 당첨
  function Pass() {
    if (!stCs.bRun) {
      return;
    }
    if (CalcLeftSec(stCs.nEndAt, performance.now()) === 0) {
      Lose();
      return;
    }
    stCs.nTurn = (stCs.nTurn + 1) % stCs.arrPs.length;
    stCs.nEndAt = performance.now() + selSec.value * 1000;
    Paint();
  }
  // 시간 끝·틀림 모두 여기로: 한 판에 한 번만 기록
  function Lose() {
    if (!stCs.bRun) {
      return;
    }
    clearTimeout(nTimer);
    stCs.bRun = false;
    stCs.stOut = stCs.arrPs[stCs.nTurn];
    PlayTone(pAudio, 90, 0.6, "sawtooth");
    navigator.vibrate?.(400);
    record(stCs.stOut, "초성 게임");
    Paint();
  }
  function Paint() {
    const arrPs = stCs.arrPs;
    const stNow = arrPs[stCs.nTurn];
    const strCs = arrKeys[stCs.nWord];
    btnNew.disabled = stCs.bRun;
    selSec.disabled = stCs.bRun;
    if (arrPs.length < 2) {
      elCard.replaceChildren(h("p", { class: "note" }, "참가자가 2명 이상이어야 해요"));
    } else if (stCs.stOut) {
      elCard.replaceChildren(h("div", { class: "cs-big" }, strCs), h("strong", {}, h("span", { class: "boom" }, "💥 "), h("span", { style: `color:${stCs.stOut.c}` }, stCs.stOut.name), " 당첨!"),
        h("small", {}, `예: ${CHOSUNG_WORDS[stCs.nWord]} · ‘새 초성’을 누르면 다시`));
    } else if (stCs.bRun) {
      const stNext = arrPs[(stCs.nTurn + 1) % arrPs.length];
      PaintLeft(CalcLeftSec(stCs.nEndAt, performance.now()));
      elCard.replaceChildren(h("div", { class: "cs-big" }, strCs), h("strong", { style: `color:${stNow.c}` }, stNow.name), elLeft,
        h("div", { class: "bar" },
          h("button", { type: "button", class: "btn primary big", onclick: Pass }, `⭕ 말했어요 → ${stNext.name}`),
          h("button", { type: "button", class: "btn big", onclick: Lose }, "❌ 틀림")));
    } else {
      elCard.replaceChildren(h("div", { class: "cs-big" }, strCs), h("small", {}, "이 초성으로 시작하는 낱말을 한 명씩 말하기 (나온 말 다시 쓰면 틀림)"),
        h("button", { type: "button", class: "btn primary big", onclick: Start }, `▶ ${stNow.name}부터 시작`));
    }
    elStrip.replaceChildren(...CreateTurnStrip(arrPs, stCs.bRun ? stNow : null));
  }
  btnNew.onclick = Ready;
  stopGame = () => {
    clearTimeout(nTimer);
    pAudio?.close();
  };
  Ready();
};

// ---- 스피드 퀴즈: 차례마다 설명할 사람이 낱말을 보고 몸·말로 설명, 나머지가 맞힘. 점수가 가장 낮은 쪽이 벌칙 ----
GAMES.speed = () => {
  const modeSel = modeSelect();
  const selSec = h("select", { class: "sel", "aria-label": "한 차례 시간" }, [30, 60, 90].map(nSec => h("option", { value: nSec }, `${nSec}초`)));
  selSec.value = "60";
  const btnNew = h("button", { type: "button", class: "btn primary" }, "🔀 처음부터");
  const elCard = h("div", { class: "liar-card" });
  const elRank = h("ol", { class: "rank" });
  const elLeft = h("div", { class: "cs-left" });   // 남은 초·점수: 똑딱마다 글자만 바꿈 (버튼을 다시 만들면 누르는 중인 터치가 씹힘)
  const arrWords = [...SPEED_ACTS, ...Object.values(LIAR_WORDS).flat()];
  const setUsed = new Set();
  let stSq = null;
  let nTimer = 0;
  let nLastSec = 0;
  let pAudio = null;
  mount("⏱ 스피드 퀴즈", [modeSel, selSec, btnNew], h("div", { class: "stack pass-wrap" }, elCard, h("div", { class: "rank-box" }, h("h3", {}, "점수"), elRank)), () => {
    if (!stSq.bRun) {
      Ready(modeSel.value);
    }
  });

  function Ready(strMode) {
    clearTimeout(nTimer);
    const stSides = sides(strMode);
    modeSel.value = stSides.mode;
    stSq = { arrPs: stSides.ps, arrScores: [], nTurn: 0, nScore: 0, nWord: 0, nEndAt: 0, bRun: false, arrOut: null };
    Paint();
  }
  function Start() {
    if (stSq.arrPs.length < 2) {
      toast("참가자(팀)가 2개 이상이어야 해요.");
      return;
    }
    pAudio ??= CreateAudio();
    stSq.bRun = true;
    stSq.nScore = 0;
    stSq.nWord = PickCard(arrWords, setUsed);
    stSq.nEndAt = performance.now() + selSec.value * 1000;
    btnNew.disabled = true;
    modeSel.disabled = true;
    selSec.disabled = true;
    Paint();
    Tick();
  }
  function Tick() {
    const nLeft = CalcLeftSec(stSq.nEndAt, performance.now());
    if (nLeft === 0) {
      TimeUp();
      return;
    }
    if (nLeft !== nLastSec && nLeft <= 5) {
      PlayTone(pAudio, 1000, 0.05);
    }
    nLastSec = nLeft;
    PaintLeft(nLeft);
    nTimer = setTimeout(Tick, 200);
  }
  function PaintLeft(nLeft) {
    elLeft.textContent = `${nLeft}초 · ${stSq.nScore}점`;
    elLeft.classList.toggle("hurry", nLeft <= 5);
  }
  // 정답(+1)·패스 → 다음 낱말. 시간이 이미 지났으면 점수 없이 차례 끝
  function Answer(bCorrect) {
    if (!stSq.bRun) {
      return;
    }
    if (CalcLeftSec(stSq.nEndAt, performance.now()) === 0) {
      TimeUp();
      return;
    }
    if (bCorrect) {
      stSq.nScore++;
      PlayTone(pAudio, 1320, 0.08, "sine");
    }
    stSq.nWord = PickCard(arrWords, setUsed);
    Paint();
  }
  // 차례 끝: 한 차례에 한 번만. 모두 끝나면 꼴찌 기록 (모두 같은 점수면 무승부)
  function TimeUp() {
    if (!stSq.bRun) {
      return;
    }
    clearTimeout(nTimer);
    stSq.bRun = false;
    stSq.arrScores.push(stSq.nScore);
    stSq.nTurn++;
    PlayTone(pAudio, 220, 0.5, "sawtooth");
    navigator.vibrate?.(300);
    if (stSq.nTurn >= stSq.arrPs.length) {
      stSq.arrOut = FindLowestSides(stSq.arrScores).map(nIdx => stSq.arrPs[nIdx]);
      for (const stP of stSq.arrOut) {
        record(stP, "스피드 퀴즈");
      }
    }
    btnNew.disabled = false;
    modeSel.disabled = false;
    selSec.disabled = false;
    Paint();
  }
  function Paint() {
    const arrPs = stSq.arrPs;
    const stNow = arrPs[stSq.nTurn];
    if (arrPs.length < 2) {
      elCard.replaceChildren(h("p", { class: "note" }, "참가자(팀)가 2개 이상이어야 해요"));
    } else if (stSq.arrOut) {
      elCard.replaceChildren(stSq.arrOut.length
        ? h("strong", {}, h("span", { class: "boom" }, "🍺 "), stSq.arrOut.map(stP => stP.name).join(", "), " 당첨!")
        : h("strong", {}, "🤝 무승부!"),
      h("small", {}, stSq.arrOut.length ? "점수가 가장 낮아요 · ‘처음부터’로 다시" : "모두 같은 점수 · ‘처음부터’로 다시"));
    } else if (stSq.bRun) {
      PaintLeft(CalcLeftSec(stSq.nEndAt, performance.now()));
      elCard.replaceChildren(elLeft, h("strong", {}, arrWords[stSq.nWord]),
        h("div", { class: "bar" },
          h("button", { type: "button", class: "btn primary big", onclick: () => Answer(true) }, "⭕ 정답"),
          h("button", { type: "button", class: "btn big", onclick: () => Answer(false) }, "⏭ 패스")));
    } else {
      elCard.replaceChildren(h("strong", { style: `color:${stNow.c}` }, `${stNow.name} 차례`),
        stNow.members ? h("small", {}, stNow.members.join(" · ")) : null,
        h("small", {}, "설명할 사람만 화면을 보고, 나머지가 맞혀요"),
        h("button", { type: "button", class: "btn primary big", onclick: Start }, `▶ 시작 (${selSec.value}초)`));
    }
    const arrDone = stSq.arrScores.map((nScore, nIdx) => ({ nScore, stP: arrPs[nIdx] })).sort((stA, stB) => stB.nScore - stA.nScore);
    elRank.replaceChildren(...arrDone.map(stRec => h("li", {}, h("i", { style: `background:${stRec.stP.c}` }), `${stRec.stP.name} · ${stRec.nScore}점`)));
  }
  modeSel.onchange = () => Ready(modeSel.value);
  btnNew.onclick = () => Ready(modeSel.value);
  stopGame = () => {
    clearTimeout(nTimer);
    pAudio?.close();
  };
  Ready("solo");
};

// ---- 벌칙 통계판: 놀이 당첨 횟수 순위 (오늘의 술상무) ----
GAMES.stats = () => {
  const list = L(), tally = list.tally || [];
  const undo = h("button", { type: "button", class: "btn" }, "↶ 마지막 기록 취소");
  const clear = h("button", { type: "button", class: "btn quiet danger" }, "기록 지우기");
  const by = new Map();
  for (const e of tally) {
    const o = by.get(e.name) || { name: e.name, n: 0, games: new Map() };
    o.n++; o.games.set(e.game, (o.games.get(e.game) || 0) + 1); by.set(e.name, o);
  }
  const rows = [...by.values()].sort((a, b) => b.n - a.n), max = rows[0]?.n || 1;
  const person = name => list.people.find(p => p.name === name);
  const dot = name => { const p = person(name); return p ? colorFor(p) : "var(--muted)"; };
  const gamesText = o => [...o.games].map(([g, n]) => `${g} ${n}`).join(" · ");
  const body = !rows.length ? h("p", { class: "hint" }, "아직 기록이 없어요. 핀볼·돌림판·스피드 룰렛·대포 뽑기·해적 룰렛·사다리·경마·업다운·폭탄 돌리기·반응속도·라이어·밸런스·이미지·초성·스피드 퀴즈에서 당첨되면 여기에 쌓여요.")
    : h("div", { class: "stack" },
      h("div", { class: "podium" }, rows.slice(0, 3).map((o, i) => h("div", { class: "pod pod-" + (i + 1) },
        h("div", { class: "pod-medal" }, ["👑", "🥈", "🥉"][i]), h("strong", {}, o.name), h("b", {}, `${o.n}회`), h("small", {}, gamesText(o))))),
      h("div", { class: "tablewrap" }, h("table", { class: "stat-tbl" }, h("tbody", {}, rows.map((o, i) => h("tr", {},
        h("td", { class: "num" }, String(i + 1)),
        h("td", { class: "stat-name" }, h("i", { class: "tok", style: `background:${dot(o.name)}` }), o.name),
        h("td", { class: "stat-bar" }, h("span", { style: `width:${o.n / max * 100}%` })),
        h("td", { class: "stat-n" }, `${o.n}회`),
        h("td", { class: "stat-g" }, gamesText(o))))))),
      h("div", { class: "who" }, h("b", {}, "최근 기록"), h("ul", { class: "log" }, tally.slice(-8).reverse().map(e =>
        h("li", {}, `${new Date(e.t).toTimeString().slice(0, 5)} · ${e.game} · ${e.name}`)))));
  mount("🍺 벌칙 통계판", [undo, clear], body, null, false);
  undo.disabled = clear.disabled = !tally.length;
  undo.onclick = () => {   // 마지막 한 번(팀이면 팀원 전체) 되돌리기
    const t = tally.at(-1).t; list.tally = tally.filter(e => e.t !== t); save(); GAMES.stats(); toast("마지막 기록을 취소했어요.");
  };
  clear.onclick = async () => {
    const v = await ask({ title: "기록 지우기", ok: "지우기", danger: true, fields: [{ type: "note", text: `‘${list.name}’의 벌칙 기록 ${tally.length}개를 모두 지울까요?\n되돌릴 수 없어요.` }] });
    if (v) { list.tally = []; save(); GAMES.stats(); }
  };
};

// ---- 자리배치: 테이블 수만큼 고르게 랜덤 ----
GAMES.seats = () => {
  const num = h("input", { type: "number", class: "num-in", min: 1, value: seatRes?.k || Math.max(1, Math.ceil(players().length / 4)), "aria-label": "테이블 수" });
  const go = h("button", { type: "button", class: "btn primary" }, "🔀 섞기");
  const copy = h("button", { type: "button", class: "btn" }, "📋 복사");
  const team = h("button", { type: "button", class: "btn", onclick: () => {
    if (!seatRes) return toast("먼저 ‘섞기’를 눌러 주세요.");
    bs = { mode: "team" }; showTab("board");   // seat 표시가 없으니 주루마블이 이 자리로 팀을 새로 짬
  } }, "🎲 이 팀으로 주루마블");
  const grid = h("div", { class: "tables" });
  mount("🪑 자리배치", [h("label", { class: "inl" }, "테이블", num, "개"), go, copy, team], grid);
  const deal = (ps, k) => { const t = Array.from({ length: k }, () => []); ps.forEach((p, i) => t[i % k].push(p)); return t; };
  const show = tables => grid.replaceChildren(...tables.map((t, i) => h("div", { class: "tbl-card" },
    h("h3", {}, `${i + 1}번 테이블`, h("small", {}, `${t.length}명`)),
    h("div", { class: "seat-list" }, t.map(p => h("span", { class: "seat", style: `--c:${colorFor(p)}` }, p.name))))));
  go.onclick = async () => {
    const ps = players(); if (!ps.length) return toast("참가자가 없어요.");
    const k = Math.max(1, Math.min(ps.length, Math.round(+num.value) || 1)); num.value = k;
    go.disabled = true;
    for (let j = 0; j < 8; j++) { show(deal(shuffle(ps), k)); await wait(70); }
    seatRes = { k, tables: deal(shuffle(ps), k) }; show(seatRes.tables); go.disabled = false;
  };
  copy.onclick = () => {
    if (!seatRes) return toast("먼저 ‘섞기’를 눌러 주세요.");
    navigator.clipboard?.writeText(seatRes.tables.map((t, i) => `${i + 1}번 테이블: ${t.map(p => p.name).join(", ")}`).join("\n"))
      .then(() => toast("복사했어요. 단톡방에 붙여넣기 하세요."), () => toast("복사하지 못했어요."));
  };
  if (seatRes) show(seatRes.tables);
  else grid.append(h("p", { class: "hint" }, "테이블 수를 정하고 ‘섞기’를 누르세요."));
};

async function devMode() {

      { id: "names", label: "생일자 이름 (여러 명이면 쉼표로)", value: sp.names || "" },
      { id: "msg", label: "축하 메시지", value: sp.msg || "생일 축하해! 오늘 주인공은 너야 🎉" },
      { id: "when", type: "select", label: "언제 띄울까요?", value: sp.when || "next",

      { id: "song", type: "checkbox", label: "생일 축하 노래 틀기 🎵", value: sp.song ?? true }],
    validate: v => v.extra || v.names ? null : "생일자 이름을 넣어 주세요." });
  if (!v) return;
  if (v.extra) { state.surprise = { ...sp, armed: false }; save(); return toast("서프라이즈를 껐어요."); }
  state.surprise = { names: v.names, msg: v.msg, when: v.when, song: v.song, armed: v.when === "next" };
  save();
  if (v.when === "now") showBirthday(state.surprise);
  else toast("🤫 준비 완료! 다음 당첨 때 짠 하고 나와요.");
}

// ================= 😈 비밀 모드: 벌칙 몰아주기 (로고 2초 길게 누르기) =================
let pressTimer;
const brand = document.querySelector(".brand");
brand.addEventListener("pointerdown", () => { clearTimeout(pressTimer); pressTimer = setTimeout(() => { logoClicks = []; rigMode(); }, 2000); });
for (const ev of ["pointerup", "pointerleave", "pointercancel"]) brand.addEventListener(ev, () => clearTimeout(pressTimer));
brand.addEventListener("contextmenu", e => e.preventDefault());   // 길게 누를 때 뜨는 메뉴 막기
async function rigMode() {
  if (IsViewOnly()) return;   // 마스터만 (보기 전용이면 아무 반응 없이 숨김)
  const rg = state.rig || {}, list = L();
  if (!list?.people.length) return toast("먼저 명단에 사람을 넣어 주세요.");
  const picked = (rg.names || "").split(/[,，]/).map(norm);
  const v = await ask({ title: "😈 벌칙 몰아주기", ok: "저장", extra: rg.on ? "끄기" : null,
    fields: [
      { type: "note", text: rg.on ? `지금 켜짐: ${rg.names} · ${rg.w >= 100 ? "무조건" : rg.w + "배"}` : "지금은 꺼져 있어요.\n핀볼·돌림판·스피드 룰렛·대포 뽑기·해적 룰렛·사다리·경마에 적용 (팀전이면 그 사람이 낀 팀)" },
      { id: "who", type: "chips", label: `누구? (‘${list.name}’에서 눌러서 고르기, 여러 명 가능)`,
        options: list.people.map(p => p.name), value: list.people.map(p => p.name).filter(n => picked.includes(norm(n))) },
      { id: "w", type: "number", label: "몇 배 잘 걸리게? (1 = 공정, 2 = 두 배, 0.5 = 오히려 덜 걸림, 100 = 무조건)", value: rg.w || 1.5 }],
    validate: v => v.extra ? null : !v.who.length ? "한 명 이상 골라 주세요." : !(+v.w > 0 && +v.w <= 100) ? "배수는 0보다 크고 100 이하로 넣어 주세요." : null });
  if (!v) return;
  state.rig = v.extra ? { ...rg, on: false } : { names: v.who.join(", "), w: +v.w, on: true };
  save(); toast(v.extra ? "껐어요." : "😈 저장했어요.");
  if (tab !== "list") showTab(tab);   // 지금 보고 있는 게임에 바로 반영
}
function surpriseHook() {   // record()에서 불림: 걸어 둔 서프라이즈가 있으면 결과 잠깐 보여준 뒤 등장
  const sp = state.surprise; if (!sp?.armed) return;
  sp.armed = false; save();
  setTimeout(() => showBirthday(sp), 1200);
}
function showBirthday(sp) {
  const names = sp.names.split(/[,，]/).map(s => s.trim()).filter(Boolean).join(" · ");
  const cv = h("canvas", { class: "confetti" });
  const ov = h("div", { class: "bday", role: "dialog", "aria-label": "생일 축하" }, cv,
    h("div", { class: "bday-in" }, h("div", { class: "bday-cake" }, "🎂"), h("small", {}, "HAPPY BIRTHDAY"),
      h("strong", {}, names), h("p", {}, sp.msg || "생일 축하해!"), h("em", {}, "눌러서 닫기")));
  (document.fullscreenElement || document.body).append(ov);
  const ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1, cols = ["#ffc46b", "#ff6b9d", "#7bd3ff", "#b48bff", "#7bd39c", "#fff27a"];
  let W, H, raf, alive = true;
  const size = () => { W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr; };
  size();
  const bits = Array.from({ length: 180 }, () => ({ x: Math.random() * W, y: -Math.random() * H, vy: (2 + Math.random() * 3) * dpr, vx: (Math.random() - .5) * 2 * dpr,
    r: Math.random() * 6, vr: (Math.random() - .5) * .2, w: (6 + Math.random() * 8) * dpr, c: cols[Math.random() * cols.length | 0] }));
  const loop = () => {
    ctx.clearRect(0, 0, W, H);
    for (const b of bits) {
      b.x += b.vx + Math.sin(b.y / 40 / dpr); b.y += b.vy; b.r += b.vr;
      if (b.y > H + 20) { b.y = -20; b.x = Math.random() * W; }
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.w / 4, b.w, b.w / 2); ctx.restore();
    }
    if (alive) raf = requestAnimationFrame(loop);
  };
  loop();
  const stopSong = sp.song === false ? null : playBirthdaySong();
  const close = () => { alive = false; cancelAnimationFrame(raf); stopSong?.(); ov.remove(); removeEventListener("keydown", esc); removeEventListener("resize", size); };
  const esc = e => { if (e.key === "Escape") close(); };
  ov.onclick = close; addEventListener("keydown", esc); addEventListener("resize", size);
}
function playBirthdaySong() {   // 신나는 생일 축하 노래: 쿵짝짝 드럼 + 베이스 + 화음 + 멜로디, 2절은 키 올려서
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), out = ac.createGain();
    out.gain.value = .55; out.connect(ac.destination);
    const B = .27, hz = m => 440 * 2 ** ((m - 69) / 12);   // B = 한 박(초)
    const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), nd = noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const env = (t, d, vol) => { const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .005);
      g.gain.exponentialRampToValueAtTime(.001, t + d); g.connect(out); return g; };
    const tone = (m, t, d, type, vol) => { const o = ac.createOscillator(); o.type = type; o.frequency.value = hz(m); o.connect(env(t, d, vol)); o.start(t); o.stop(t + d + .05); };
    const hiss = (t, d, vol, cut) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(); s.buffer = noise; f.type = "highpass"; f.frequency.value = cut;
      s.connect(f); f.connect(env(t, d, vol)); s.start(t); s.stop(t + d + .05); };
    const kick = t => { const o = ac.createOscillator(); o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(40, t + .15);
      o.connect(env(t, .22, .9)); o.start(t); o.stop(t + .3); };
    const C = [36, 64, 67, 72], G = [31, 62, 65, 71], F = [29, 65, 69, 72];   // [베이스, 화음 3음]
    const BARS = [C, C, G, G, C, C, F, C, C];   // 첫 마디는 드럼 전주 (마지막 박부터 노래)
    const MEL = [[67, .5], [67, .5], [69, 1], [67, 1], [72, 1], [71, 2], [67, .5], [67, .5], [69, 1], [67, 1], [74, 1], [72, 2],
      [67, .5], [67, .5], [79, 1], [76, 1], [72, 1], [71, 1], [69, 1], [77, .5], [77, .5], [76, 1], [72, 1], [74, 1], [72, 3]];
    let t = ac.currentTime + .1;
    for (let rep = 0; rep < 2; rep++) {
      const up = rep * 2;   // 2절은 한 음 올려서 더 신나게
      BARS.forEach((ch, b) => { for (let k = 0; k < 3; k++) {
        const bt = t + (b * 3 + k) * B;
        if (k === 0) { kick(bt); tone(ch[0] + up, bt, B * .9, "sawtooth", .1); }                 // 쿵 + 베이스
        else { hiss(bt, .12, .3, 1800); if (b) for (const m of ch.slice(1)) tone(m + up, bt, B * .45, "square", .025); }   // 짝 + 화음
        hiss(bt + B / 2, .04, .1, 7000);   // 하이햇
      } });
      let mt = t + 2 * B;
      for (const [m, d] of MEL) {
        tone(m + up, mt, d * B * .9, "square", .07); tone(m + up + 12, mt, d * B * .9, "triangle", .05);   // 멜로디 (반짝이는 옥타브 겹침)
        mt += d * B;
      }
      t += BARS.length * 3 * B;
    }
    kick(t); hiss(t, 1.4, .35, 2500);   // 짠! 마무리
    for (const m of [52, 64, 67, 72, 76, 79]) tone(m + 2, t, 1.6, "triangle", .07);
    return () => ac.close();
  } catch { return null; }
}
